<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jet Fighter || Air Combat</title>
    <link rel="icon" type="image/png" href="https://png.pngtree.com/png-vector/20221116/ourmid/pngtree-fighter-jet-military-plane-vector-png-image_6457508.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --cyan:#67e8f9; --panel:rgba(4,13,22,.82); --border:rgba(255,255,255,.16); --gold:#fbbf24; }
        body::before{content:'';position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 45%,rgba(0,0,0,.25) 100%);mix-blend-mode:multiply;}
        body::after{content:'';position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.055;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:7px 7px;mix-blend-mode:overlay;}
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Outfit',sans-serif; }
        html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#07131c; color:#fff; touch-action:none; }
        #gameWrapper { position:fixed; inset:0; }
        canvas { display:block; width:100%; height:100%; }
        .topbar { position:fixed; z-index:30; top:max(10px,env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; pointer-events:none; }
        .topbar a, .icon-btn { pointer-events:auto; width:42px; height:42px; display:grid; place-items:center; border-radius:11px; border:1px solid var(--border); background:var(--panel); color:#fff; text-decoration:none; cursor:pointer; backdrop-filter:blur(8px); }
        .topbar a:hover, .icon-btn:hover, .icon-btn.active { color:var(--cyan); border-color:var(--cyan); }
        .pause-overlay { position:fixed; inset:0; z-index:80; display:none; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem; text-align:center; padding:2rem; background:rgba(3,10,16,.86); backdrop-filter:blur(6px); }
        .pause-overlay.show { display:flex; }
        .pause-overlay h2 { color:var(--cyan); font-size:clamp(1.9rem,5vw,2.8rem); letter-spacing:.18em; text-shadow:0 0 28px rgba(103,232,249,.35); }
        .pause-overlay p { color:#a9bdc8; }
        .pause-btn { min-width:190px; padding:.8rem 2rem; border:0; border-radius:12px; font-size:1rem; font-weight:800; color:#06131b; background:linear-gradient(135deg,var(--cyan),#38bdf8); cursor:pointer; }
        .pause-btn.secondary { color:#fff; background:var(--panel); border:1px solid var(--border); }
        .pause-btn:hover { transform:translateY(-2px); }
        @media (max-width: 700px){.topbar{left:8px;right:8px}.topbar a,.icon-btn{width:40px;height:40px}.pause-overlay{padding:1rem}.pause-btn{min-width:min(240px,84vw)}}
    </style>
</head>
<body>
    <div id="gameWrapper"><canvas id="gameCanvas" aria-label="Jet Fighter game canvas"></canvas></div>
    <div class="topbar">
        <a href="../index.html" title="Back to hub" aria-label="Back to hub"><i class="fa-solid fa-arrow-left"></i></a>
        <button class="icon-btn" id="pauseBtn" title="Pause (P)" aria-label="Pause"><i class="fa-solid fa-pause"></i></button>
    </div>
    <div class="pause-overlay" id="pauseOverlay">
        <h2>PAUSED</h2>
        <p>Take a breather, Commander.</p>
        <button class="pause-btn" id="resumeBtn"><i class="fa-solid fa-play"></i> Resume</button>
        <button class="pause-btn secondary" id="restartBtn"><i class="fa-solid fa-rotate-right"></i> Restart</button>
    </div>
    <script src="jetfighter.js"></script>
</body>
</html>
