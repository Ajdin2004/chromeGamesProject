<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper | Chromium Games</title>
    <link rel="icon" type="image/png" href="https://freepngimg.com/save/91765-minesweeper-star-microsoft-symmetry-classic-free-hq-image/1024x1024">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* ---- DARK THEME (default) ---- */
            --bg-color: #16171c;
            --card-bg: #232429;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-cyan: #7aa7d6;
            --accent-fg: #101218;
            --primary-magenta: #d97f78;
            --text-main: #e8e6e0;
            --text-muted: #9aa0a8;
            --soft-bg: #1d1e23;
            --btn-primary-bg: #eceeed;
            --btn-primary-fg: #1c1d21;
            --btn-primary-border: #eceeed;
            --shadow-card: rgba(0, 0, 0, 0.35);
            --shadow-board: rgba(0, 0, 0, 0.42);
            --cell-bg: #4a4f5a;
            --cell-border: #33363d;
            --cell-hover-bg: #565c68;
            --cell-hover-border: #14161a;
            --cell-revealed-bg: #2d2f36;
            --cell-revealed-border: #26282e;
            --flag-color: #e27d72;
            --mine-color: #d9534a;
            --num-1: #7ab8ff;
            --num-2: #7ed17f;
            --num-3: #ff8f85;
            --num-4: #b092ff;
            --num-5: #ffb74d;
            --num-6: #80deea;
            --num-7: #ececec;
            --num-8: #b0b7bf;
        }

        :root[data-theme="light"] {
            /* ---- LIGHT THEME ---- */
            --bg-color: #f1efe8;
            --card-bg: #ffffff;
            --card-border: #e2ded4;
            --primary-cyan: #3d6ea5;
            --accent-fg: #ffffff;
            --primary-magenta: #b3423b;
            --text-main: #2b2b29;
            --text-muted: #7d7a72;
            --soft-bg: #f4f2ec;
            --btn-primary-bg: #20201f;
            --btn-primary-fg: #ffffff;
            --btn-primary-border: #20201f;
            --shadow-card: rgba(52, 48, 40, 0.06);
            --shadow-board: rgba(52, 48, 40, 0.12);
            --cell-bg: #e8e5dc;
            --cell-border: #d5d1c6;
            --cell-hover-bg: #e0ddd3;
            --cell-hover-border: #bfbaad;
            --cell-revealed-bg: #f7f5ef;
            --cell-revealed-border: #e7e3d9;
            --flag-color: #b3423b;
            --mine-color: #c0392b;
            --num-1: #1976d2;
            --num-2: #388e3c;
            --num-3: #d32f2f;
            --num-4: #283593;
            --num-5: #8d3d26;
            --num-6: #00838f;
            --num-7: #20201f;
            --num-8: #6d6d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
            overflow-x: hidden;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 0.75rem;
            z-index: 10;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--primary-cyan);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .theme-toggle:hover { border-color: var(--primary-cyan); color: var(--primary-cyan); }
        .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: inline; }

        /* Controls & Mode Bar */
        .controls-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 900px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: flex;
            gap: 0.4rem;
            background: var(--card-bg);
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--primary-cyan);
            color: var(--accent-fg);
            font-weight: 700;
        }

        .btn-action {
            padding: 0.65rem 1.2rem;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: var(--soft-bg);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
        }

        .btn-primary {
            background: var(--btn-primary-bg);
            border: 1px solid var(--btn-primary-border);
            color: var(--btn-primary-fg);
        }
        .btn-primary:hover { opacity: 0.9; color: var(--btn-primary-fg); border-color: var(--btn-primary-border); }

        /* Main Game Layout Grid */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
            width: 100%;
            max-width: 1200px;
            align-items: start;
        }

        /* Board Container */
        .game-wrapper {
            position: relative;
            box-shadow: 0 18px 44px var(--shadow-board);
            border-radius: 20px;
            overflow: auto;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Info Bar (mines, timer, reset) */
        .info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding: 0.6rem 1rem;
            background: var(--soft-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            min-width: 280px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-cyan);
        }

        .info-item i {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .reset-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
        }

        /* Board Grid */
        #board {
            display: grid;
            gap: 2px;
            margin: 0 auto;
            width: fit-content;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--cell-size) * 0.42);
            font-weight: 800;
            cursor: pointer;
            position: relative;
            transition: background 0.1s ease;
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            border-radius: 4px;
        }

        .cell:hover {
            background: var(--cell-hover-bg);
            border-color: var(--cell-hover-border);
        }

        .cell.revealed {
            background: var(--cell-revealed-bg);
            border-color: var(--cell-revealed-border);
            cursor: default;
        }

        .cell.revealed:hover {
            background: var(--cell-revealed-bg);
            border-color: var(--cell-revealed-border);
        }

        .cell.flagged {
            color: var(--flag-color);
        }

        .cell.mine {
            color: var(--mine-color);
            background: rgba(192, 57, 43, 0.10);
        }

        .cell.mine-hit {
            background: rgba(192, 57, 43, 0.35) !important;
            border-color: #c0392b !important;
        }

        .cell.wrong-flag {
            background: rgba(192, 57, 43, 0.15) !important;
            border-color: #b3423b !important;
        }

        .cell.winning {
            background: rgba(77, 122, 80, 0.12) !important;
            border-color: #4d7a50 !important;
        }

        .num-1 { color: var(--num-1); }
        .num-2 { color: var(--num-2); }
        .num-3 { color: var(--num-3); }
        .num-4 { color: var(--num-4); }
        .num-5 { color: var(--num-5); }
        .num-6 { color: var(--num-6); }
        .num-7 { color: var(--num-7); }
        .num-8 { color: var(--num-8); }

        /* Sidebar Info Box */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 10px 30px var(--shadow-card);
        }

        .panel h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .status-msg {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary-cyan);
        }

        /* Scoreboard */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .score-item {
            text-align: center;
            padding: 0.6rem 0.4rem;
            background: var(--soft-bg);
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .score-item .score-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-item .score-value {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 0.2rem;
        }

        .score-item.wins .score-value { color: var(--primary-cyan); }
        .score-item.losses .score-value { color: var(--primary-magenta); }
        .score-item.best .score-value { color: var(--text-muted); }

        /* How to Play */
        .how-to-play {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .how-to-play ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .how-to-play li {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .how-to-play i {
            color: var(--primary-cyan);
            margin-top: 0.2rem;
            font-size: 0.75rem;
        }

        /* Desktop Layout Adaptations */
        @media (min-width: 850px) {
            .main-layout {
                grid-template-columns: 1fr 280px;
            }
            .sidebar { height: 100%; }
        }

        /* Note: cell sizing is fully controlled by JS (inline --cell-size),
           so no CSS override for #board is needed here. */
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <div class="header-right">
            <h2>Minesweeper</h2>
            <button id="theme-toggle" class="theme-toggle" title="Toggle light / dark mode" aria-label="Toggle theme">
                <i class="fa-solid fa-sun icon-sun"></i>
                <i class="fa-solid fa-moon icon-moon"></i>
            </button>
        </div>
    </div>

    <!-- Difficulty & Controls Bar -->
    <div class="controls-bar">
        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-beginner">Beginner</button>
            <button class="mode-btn" id="btn-intermediate">Intermediate</button>
            <button class="mode-btn" id="btn-expert">Expert</button>
        </div>

        <button class="btn-action btn-primary" id="btn-new-game"><i class="fa-solid fa-rotate-right"></i> New Game</button>
    </div>

    <div class="main-layout">
        <!-- Board -->
        <div class="game-wrapper">
            <div class="info-bar">
                <div class="info-item" id="mine-counter"><i class="fa-solid fa-bomb"></i> <span>10</span></div>
                <button class="reset-btn" id="btn-reset" title="Reset Game"><i class="fa-solid fa-face-smile"></i></button>
                <div class="info-item" id="timer"><i class="fa-solid fa-stopwatch"></i> <span>0</span></div>
            </div>
            <div id="board"></div>
        </div>

        <!-- Sidebar Panel -->
        <div class="sidebar">
            <div class="panel">
                <h3>STATUS</h3>
                <div id="status" class="status-msg">Click a cell to start!</div>
            </div>

            <div class="panel">
                <h3>SCOREBOARD</h3>
                <div class="scoreboard">
                    <div class="score-item wins">
                        <div class="score-label">Wins</div>
                        <div class="score-value" id="score-wins">0</div>
                    </div>
                    <div class="score-item losses">
                        <div class="score-label">Losses</div>
                        <div class="score-value" id="score-losses">0</div>
                    </div>
                    <div class="score-item best">
                        <div class="score-label">Best Time</div>
                        <div class="score-value" id="score-best">--</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>HOW TO PLAY</h3>
                <div class="how-to-play">
                    <ul>
                        <li><i class="fa-solid fa-chevron-right"></i> Left-click to reveal a cell</li>
                        <li><i class="fa-solid fa-chevron-right"></i> Right-click to flag a mine</li>
                        <li><i class="fa-solid fa-chevron-right"></i> Numbers show adjacent mines</li>
                        <li><i class="fa-solid fa-chevron-right"></i> Reveal all safe cells to win</li>
                        <li><i class="fa-solid fa-chevron-right"></i> First click is always safe</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle — dark is the default, persisted across all games
        (function () {
            var KEY = 'cg_theme';
            var theme = localStorage.getItem(KEY) || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (btn) btn.addEventListener('click', function () {
                theme = theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem(KEY, theme);
                document.documentElement.setAttribute('data-theme', theme);
            });
        })();
    </script>

    <script src="minesweeper.js"></script>
</body>
</html>
