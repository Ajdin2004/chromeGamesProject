<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Minesweeper | Chromium Games</title>
    <link rel="icon" type="image/png" href="https://freepngimg.com/save/91765-minesweeper-star-microsoft-symmetry-classic-free-hq-image/1024x1024">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(22, 27, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-cyan: #00f2fe;
            --primary-magenta: #ff0080;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
            overflow-x: hidden;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 0.75rem;
            z-index: 10;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--primary-cyan);
        }

        /* Controls & Mode Bar */
        .controls-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 900px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: flex;
            gap: 0.4rem;
            background: var(--card-bg);
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-magenta));
            color: #000;
            font-weight: 800;
        }

        .btn-action {
            padding: 0.65rem 1.2rem;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-magenta));
            border: none;
            color: #000;
        }
        .btn-primary:hover { opacity: 0.9; color: #000; }

        /* Main Game Layout Grid */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
            width: 100%;
            max-width: 1200px;
            align-items: start;
        }

        /* Board Container */
        .game-wrapper {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 242, 254, 0.15);
            border-radius: 20px;
            overflow: auto;
            border: 1px solid var(--card-border);
            background: rgba(15, 18, 35, 0.9);
            width: 100%;
            margin: 0 auto;
            backdrop-filter: blur(16px);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Info Bar (mines, timer, reset) */
        .info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding: 0.6rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            min-width: 280px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .info-item i {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .reset-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        /* Board Grid */
        #board {
            display: grid;
            gap: 2px;
            margin: 0 auto;
            width: fit-content;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--cell-size) * 0.42);
            font-weight: 800;
            cursor: pointer;
            position: relative;
            transition: background 0.1s ease, transform 0.1s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .cell:hover {
            background: rgba(0, 242, 254, 0.1);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .cell.revealed {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.04);
            cursor: default;
        }

        .cell.revealed:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .cell.flagged {
            color: var(--primary-magenta);
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.6);
        }

        .cell.mine {
            color: #ef4444;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            background: rgba(239, 68, 68, 0.15);
        }

        .cell.mine-hit {
            background: rgba(239, 68, 68, 0.4) !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .cell.wrong-flag {
            background: rgba(255, 0, 128, 0.2) !important;
            border-color: var(--primary-magenta) !important;
        }

        .cell.winning {
            background: rgba(34, 197, 94, 0.15) !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
        }

        .num-1 { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
        .num-2 { color: #4ade80; text-shadow: 0 0 8px rgba(74, 222, 128, 0.5); }
        .num-3 { color: #f87171; text-shadow: 0 0 8px rgba(248, 113, 113, 0.5); }
        .num-4 { color: #c084fc; text-shadow: 0 0 8px rgba(192, 132, 252, 0.5); }
        .num-5 { color: #facc15; text-shadow: 0 0 8px rgba(250, 204, 21, 0.5); }
        .num-6 { color: #fb923c; text-shadow: 0 0 8px rgba(251, 146, 60, 0.5); }
        .num-7 { color: #f472b6; text-shadow: 0 0 8px rgba(244, 114, 182, 0.5); }
        .num-8 { color: #e2e8f0; text-shadow: 0 0 8px rgba(226, 232, 240, 0.5); }

        /* Sidebar Info Box */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .panel h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .status-msg {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-cyan);
        }

        /* Scoreboard */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .score-item {
            text-align: center;
            padding: 0.6rem 0.4rem;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .score-item .score-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-item .score-value {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 0.2rem;
        }

        .score-item.wins .score-value { color: var(--primary-cyan); }
        .score-item.losses .score-value { color: var(--primary-magenta); }
        .score-item.best .score-value { color: #facc15; }

        /* How to Play */
        .how-to-play {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .how-to-play ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .how-to-play li {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .how-to-play i {
            color: var(--primary-cyan);
            margin-top: 0.2rem;
            font-size: 0.75rem;
        }

        /* Desktop Layout Adaptations */
        @media (min-width: 850px) {
            .main-layout {
                grid-template-columns: 1fr 280px;
            }
            .sidebar { height: 100%; }
        }

        @media (max-width: 600px) {
            #board {
                --cell-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <h2>Neon Minesweeper</h2>
    </div>

    <!-- Difficulty & Controls Bar -->
    <div class="controls-bar">
        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-beginner">Beginner</button>
            <button class="mode-btn" id="btn-intermediate">Intermediate</button>
            <button class="mode-btn" id="btn-expert">Expert</button>
        </div>

        <button class="btn-action btn-primary" id="btn-new-game"><i class="fa-solid fa-rotate-right"></i> New Game</button>
    </div>

    <div class="main-layout">
        <!-- Board -->
        <div class="game-wrapper">
            <div class="info-bar">
                <div class="info-item" id="mine-counter"><i class="fa-solid fa-bomb"></i> <span>10</span></div>
                <button class="reset-btn" id="btn-reset" title="Reset Game"><i class="fa-solid fa-face-smile"></i></button>
                <div class="info-item" id="timer"><i class="fa-solid fa-stopwatch"></i> <span>0</span></div>
            </div>
            <div id="board"></div>
        </div>

        <!-- Sidebar Panel -->
        <div class="sidebar">
            <div class="panel">
                <h3>STATUS</h3>
                <div id="status" class="status-msg">Click a cell to start!</div>
            </div>

            <div class="panel">
                <h3>SCOREBOARD</h3>
                <div class="scoreboard">
                    <div class="score-item wins">
                        <div class="score-label">Wins</div>
                        <div class="score-value" id="score-wins">0</div>
                    </div>
                    <div class="score-item losses">
                        <div class="score-label">Losses</div>
                        <div class="score-value" id="score-losses">0</div>
                    </div>
                    <div class="score-item best">
                        <div class="score-label">Best Time</div>
                        <div class="score-value" id="score-best">--</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>HOW TO PLAY</h3>
                <div class="how-to-play">
                    <ul>
                        <li><i class="fa-solid fa-chevron-right"></i> Left-click to reveal a cell</li>
                        <li><i class="fa-solid fa-chevron-right"></i> Right-click to flag a mine</li>
                        <li><i class="fa-solid fa-chevron-right"></i> Numbers show adjacent mines</li>
                        <li><i class="fa-solid fa-chevron-right"></i> Reveal all safe cells to win</li>
                        <li><i class="fa-solid fa-chevron-right"></i> First click is always safe</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="minesweeper.js"></script>
</body>
</html>
