<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chrome Dino · Custom Studio</title>
    <link rel="icon" type="image/png" href="https://static.wikia.nocookie.net/oneyplays/images/4/41/0_9U_PkckAUtKGrb_R.png/revision/latest?cb=20201105221000">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        /* Full Screen Reset */
        body {
            background: #0b0d19; overflow: hidden; height: 100vh; width: 100vw;
            color: #000000; position: relative; touch-action: none;
        }
        
        /* Floating Header Overlay */
        .header {
            position: absolute; top: 1.5rem; left: 1.5rem; right: 1.5rem; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
        }
        .back { color: #d3d3d5; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; transition: 0.2s; }
        .back:hover { color: #00f2fe; }
        
        /* Full Screen Game Wrapper */
        .game-wrapper {
            position: absolute; inset: 0; width: 100%; height: 100%;
            background: #000000; z-index: 1;
            display: flex; align-items: center; justify-content: center; /* Added Flexbox */
        }
        canvas { display: block; width: 100%; height: 100%; background: transparent; }
        
        /* Floating Info Bar */
        .info {
            position: absolute; bottom: 1.5rem; width: 100%; z-index: 10;
            display: flex; justify-content: center; gap: 1.8rem;
            font-weight: 400; color: #94a3b8; font-size: 0.85rem; flex-wrap: wrap;
        }
        .info i { margin-right: 0.25rem; color: #4facfe; }

        /* --- UPGRADED PIXEL EDITOR CSS --- */
        .editor-overlay {
            position: absolute; inset: 0; background: rgba(11, 13, 25, 0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .editor-overlay.show { display: flex; }
        
        .editor-toolbar { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; width: 320px; }
        .tool-btn { 
            background: #1e293b; color: #94a3b8; border: 1px solid #334155; 
            padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; flex: 1; transition: 0.2s;
        }
        .tool-btn.active { background: #00f2fe; color: #000; border-color: #00f2fe; }
        .tool-btn:hover:not(.active) { background: #334155; color: #fff; }
        .tool-btn.danger { background: #ef4444; color: #fff; border-color: #ef4444; flex: 0.3; }

        /* Fixed Grid Scaling (320px divides perfectly by 32 into 10px squares) */
        .pixel-grid {
            display: grid; grid-template-columns: repeat(32, 1fr); 
            width: 320px; height: 320px; background: rgba(255,255,255,0.05); 
            border: 2px solid #00f2fe; cursor: crosshair; box-shadow: 0 10px 30px rgba(0, 242, 254, 0.1);
        }
        .pixel { border: 1px solid rgba(255,255,255,0.03); user-select: none; }
        .pixel.active { background: #00f2fe; border-color: #00f2fe; }
        
        .editor-btns { margin-top: 1rem; width: 320px; }
        .btn-play { 
            width: 100%; background: #00f2fe; color: #000; border: none; 
            padding: 0.8rem; border-radius: 8px; font-weight: 800; font-size: 1rem;
            cursor: pointer; transition: 0.2s;
        }
        .btn-play:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 242, 254, 0.3); }
    </style>
</head>
<body>
    <div class="header">
        <a href="../index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <h2 style="font-weight: 600; font-size: 1.2rem; letter-spacing: 0.5px; color:#d3d3d5;">Dino Studio</h2>
        <span style="font-size: 0.8rem; color: #64748b;"><i class="fa-regular fa-star"></i> High: <span id="highDisplay">0</span></span>
    </div>
    
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UPGRADED EDITOR OVERLAY -->
        <div id="editorOverlay" class="editor-overlay">
            <div class="editor-toolbar">
                <button id="btnFrame0" class="tool-btn active">Frame 1</button>
                <button id="btnFrame1" class="tool-btn">Frame 2</button>
                <button id="btnCopy" class="tool-btn" style="flex: 1.2;"><i class="fa-solid fa-copy"></i> Copy to Other</button>
            </div>
            <div class="editor-toolbar">
                <button id="btnBrush" class="tool-btn active"><i class="fa-solid fa-paintbrush"></i> Brush</button>
                <button id="btnEraser" class="tool-btn"><i class="fa-solid fa-eraser"></i> Eraser</button>
                <button id="clearDinoBtn" class="tool-btn danger" title="Clear Grid"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div id="pixelGrid" class="pixel-grid"></div>
            <div class="editor-btns">
                <button id="saveDinoBtn" class="btn-play"><i class="fa-solid fa-play"></i> START GAME</button>
            </div>
        </div>
    </div>
    
    <div class="info">
        <span><i class="fa-regular fa-keyboard"></i> Space / ↑ / Tap</span>
        <span><i class="fa-solid fa-arrow-down"></i> Duck</span>
        <span id="openEditorBtn" style="cursor:pointer; color:#00f2fe; font-weight: 600; transition: 0.2s; text-shadow: 0 0 4px rgba(0,0,0,0.5);">
            <i class="fa-solid fa-palette"></i> Edit Dino
        </span>
    </div>

    <script src="dino.js"></script>
</body>
</html>
