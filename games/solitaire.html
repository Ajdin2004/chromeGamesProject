<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solitaire · Classic</title>
    <link rel="icon" type="image/png" href="https://www.pngarts.com/files/3/Cards-PNG-Image-Transparent.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        :root {
            /* ---- DARK THEME (default) ---- */
            --bg: #191a1e;
            --text: #e8e6e0;
            --back-hover: #7aa7d6;
            --felt: #143128;
            --felt-border: rgba(255, 255, 255, 0.10);
            --felt-shadow: rgba(0, 0, 0, 0.55);
            --btn-bg: #2a2c33;
            --btn-border: rgba(255, 255, 255, 0.10);
            --btn-fg: #e8e6e0;
            --btn-hover-bg: #34373f;
            --btn-hover-border: #7aa7d6;
            --overlay-bg: rgba(18, 19, 22, 0.93);
            --overlay-title: #efece4;
            --overlay-sub: #9aa0a8;
            --orientation-bg: rgba(18, 19, 22, 0.95);
            --card-bg: #232429;
            --card-border: rgba(255, 255, 255, 0.10);
            --slot-stroke: rgba(255, 255, 255, 0.10);
            --slot-suit: rgba(255, 255, 255, 0.06);
        }

        :root[data-theme="light"] {
            /* ---- LIGHT THEME ---- */
            --bg: #efece4;
            --text: #2b2b29;
            --back-hover: #3d6ea5;
            --felt: #425f4a;
            --felt-border: rgba(32, 32, 28, 0.15);
            --felt-shadow: rgba(52, 48, 40, 0.28);
            --btn-bg: #ffffff;
            --btn-border: #d5d1c6;
            --btn-fg: #2b2b29;
            --btn-hover-bg: #e7e3d9;
            --btn-hover-border: #3d6ea5;
            --overlay-bg: rgba(240, 237, 228, 0.92);
            --overlay-title: #20201f;
            --overlay-sub: #7d7a72;
            --orientation-bg: rgba(239, 236, 228, 0.95);
            --card-bg: #ffffff;
            --card-border: #e2ded4;
            --slot-stroke: rgba(0, 0, 0, 0.12);
            --slot-suit: rgba(0, 0, 0, 0.08);
        }

        body {
            background: var(--bg);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            color: var(--text);
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1600px;
            margin-bottom: 0.25rem;
        }
        .back {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.2s;
        }
        .back:hover { color: var(--back-hover); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--btn-fg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-toggle:hover { border-color: var(--btn-hover-border); color: var(--btn-hover-border); }
        .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: inline; }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1600px;
            flex: 1;
            min-height: 0;
            background: var(--felt);
            border-radius: 16px;
            border: 1px solid var(--felt-border);
            box-shadow: 0 20px 50px var(--felt-shadow);
            overflow: hidden;
            user-select: none;
            margin-bottom: 0.5rem;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .win-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .win-overlay h1 {
            font-size: clamp(1.8rem, 6vw, 3rem);
            color: var(--overlay-title);
            text-align: center;
        }

        .win-overlay p {
            color: var(--overlay-sub);
            font-size: 1rem;
        }

        .controls {
            width: 100%;
            max-width: 1600px;
            display: flex;
            justify-content: center;
            margin-top: 0;
            margin-bottom: 0.25rem;
            gap: 1rem;
        }

        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--btn-fg);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
        }

        /* Device orientation notice */
.orientation-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--orientation-bg);
    backdrop-filter: blur(16px);
    text-align: center;
    opacity: 1;
    transition: opacity 0.25s ease;
}

.orientation-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.orientation-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.orientation-icon {
    font-size: 2.2rem;
    color: var(--back-hover);
    animation: rotateHint 2s infinite ease-in-out;
}

.orientation-card h3 {
    font-size: 1.1rem;
    color: var(--text);
}

.orientation-card p {
    font-size: 0.85rem;
    color: var(--overlay-sub);
    line-height: 1.4;
}
@keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
}

        /* Adjust game container layout when header is auto-hidden in landscape */
@media (orientation: landscape) and (max-height: 520px) {
    #game-container {
        top: var(--safe-top);
    }
}

@media (orientation: landscape) and (max-height: 520px) {
    :root {
        --header-h: 42px;
        --controls-h: 78px;
    }
        
        }        
    </style>
</head>
<body>

<div id="orientation-overlay" class="orientation-overlay hidden" aria-hidden="true">
    <div class="orientation-card">
        <i class="fa-solid fa-mobile-screen-button orientation-icon"></i>
        <h3>Rotate Your Device</h3>
        <p>For the best gameplay experience on mobile, please turn your device sideways to landscape mode.</p>
        <button class="btn primary" id="dismiss-orientation-btn">Continue Anyway</button>
    </div>
</div>

<div class="header">
    <a href="../index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    <h2 style="font-weight: 600; font-size: 1.2rem; letter-spacing: 0.5px;">Solitaire</h2>
    <button id="theme-toggle" class="theme-toggle" title="Toggle light / dark mode" aria-label="Toggle theme">
        <i class="fa-solid fa-sun icon-sun"></i>
        <i class="fa-solid fa-moon icon-moon"></i>
    </button>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="win-overlay" class="win-overlay hidden">
        <h1><i class="fa-solid fa-trophy" style="color:#facc15;"></i> You Won!</h1>
        <p>All four foundations complete. Great game!</p>
        <button class="btn" id="win-new-game">Play Again</button>
    </div>
</div>

<div class="controls">
    <button class="btn" id="new-game">New Game</button>
    <button class="btn" id="undo-btn">Undo</button>
</div>

<script>
        // Theme toggle — dark is the default, persisted across all games
        (function () {
            var KEY = 'cg_theme';
            var theme = localStorage.getItem(KEY) || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (btn) btn.addEventListener('click', function () {
                theme = theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem(KEY, theme);
                document.documentElement.setAttribute('data-theme', theme);
            });
        })();
    </script>

    <script src="solitaire.js"></script>
</body>
</html>
