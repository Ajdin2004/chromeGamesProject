<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solitaire · Classic</title>
    <link rel="icon" type="image/png" href="https://www.pngarts.com/files/3/Cards-PNG-Image-Transparent.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: #0b0d19;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            color: #f0f4f8;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1600px;
            margin-bottom: 0.25rem;
        }
        .back {
            color: #f0f4f8;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.2s;
        }
        .back:hover { color: #00f2fe; }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1600px;
            flex: 1;
            min-height: 0;
            background: #101426;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            user-select: none;
            margin-bottom: 0.5rem;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 13, 25, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .win-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .win-overlay h1 {
            font-size: clamp(1.8rem, 6vw, 3rem);
            background: linear-gradient(135deg, #00f2fe, #7928ca, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .win-overlay p {
            color: #9ca3af;
            font-size: 1rem;
        }

        .controls {
            width: 100%;
            max-width: 1600px;
            display: flex;
            justify-content: center;
            margin-top: 0;
            margin-bottom: 0.25rem;
            gap: 1rem;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: #00f2fe;
        }

        /* Device orientation notice */
.orientation-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(5, 8, 16, 0.95);
    backdrop-filter: blur(16px);
    text-align: center;
    opacity: 1;
    transition: opacity 0.25s ease;
}

.orientation-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.orientation-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 24px;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.orientation-icon {
    font-size: 2.2rem;
    color: #67e8f9;
    animation: rotateHint 2s infinite ease-in-out;
}

.orientation-card h3 {
    font-size: 1.1rem;
    color: #f8fafc;
}

.orientation-card p {
    font-size: 0.85rem;
    color: #94a3b8;
    line-height: 1.4;
}
@keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
}

        /* Adjust game container layout when header is auto-hidden in landscape */
@media (orientation: landscape) and (max-height: 520px) {
    #game-container {
        top: var(--safe-top);
    }
}

@media (orientation: landscape) and (max-height: 520px) {
    :root {
        --header-h: 42px;
        --controls-h: 78px;
    }
        
        }        
    </style>
</head>
<body>

<div id="orientation-overlay" class="orientation-overlay hidden" aria-hidden="true">
    <div class="orientation-card">
        <i class="fa-solid fa-mobile-screen-button orientation-icon"></i>
        <h3>Rotate Your Device</h3>
        <p>For the best gameplay experience on mobile, please turn your device sideways to landscape mode.</p>
        <button class="btn primary" id="dismiss-orientation-btn">Continue Anyway</button>
    </div>
</div>

<div class="header">
    <a href="../index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    <h2 style="font-weight: 600; font-size: 1.2rem; letter-spacing: 0.5px;">Solitaire</h2>
    <div style="width: 50px;"></div> 
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="win-overlay" class="win-overlay hidden">
        <h1><i class="fa-solid fa-trophy" style="color:#facc15;"></i> You Won!</h1>
        <p>All four foundations complete. Great game!</p>
        <button class="btn" id="win-new-game">Play Again</button>
    </div>
</div>

<div class="controls">
    <button class="btn" id="new-game">New Game</button>
    <button class="btn" id="undo-btn">Undo</button>
</div>

<script src="solitaire.js"></script>
</body>
</html>
