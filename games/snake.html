<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake · Enhanced</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: #0b0d19;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #f0f4f8;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 460px;
            margin-bottom: 0.8rem;
        }
        .back {
            color: #f0f4f8;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.2s;
        }
        .back:hover { color: #00f2fe; }
        .difficulty-wrap {
            display: flex;
            gap: 0.4rem;
            background: rgba(255,255,255,0.04);
            padding: 0.25rem 0.6rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .diff-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .diff-btn.active {
            background: #00f2fe22;
            color: #00f2fe;
            box-shadow: 0 0 12px #00f2fe22;
        }
        .diff-btn:hover { color: white; }
        .game-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 242, 254, 0.12);
            border: 1px solid rgba(255,255,255,0.06);
            max-width: 460px;
            width: 100%;
            aspect-ratio: 1/1;
            background: #101426;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            background: transparent;
        }
        .info {
            margin-top: 0.8rem;
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            font-weight: 400;
            color: #94a3b8;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }
        .info i { margin-right: 0.25rem; color: #4facfe; }
        @media (max-width: 480px) {
            .header { flex-wrap: wrap; gap: 0.4rem; }
            .difficulty-wrap { margin-left: auto; }
        }
    </style>
</head>
<body>
<div class="header">
    <a href="../index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    <h2 style="font-weight: 600; font-size: 1.2rem; letter-spacing: 0.5px;">Snake</h2>
    <div class="difficulty-wrap" id="difficultyGroup">
        <button class="diff-btn active" data-diff="easy">Easy</button>
        <button class="diff-btn" data-diff="medium">Med</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
    </div>
</div>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
</div>
<div class="info">
    <span><i class="fa-regular fa-keyboard"></i> Arrow / WASD</span>
    <span><i class="fa-regular fa-trophy"></i> High: <span id="highDisplay">0</span></span>
</div>
    <script src="snake.js"></script>
</body>
</html>
