<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-Ball Pool Pro | Chromium Games</title>
    <link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/thumbnails/020/575/858/small/3d-icon-illustration-billiard-ball-number-eight-png.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(11, 13, 25, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary-cyan: #00f2fe;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            touch-action: none; /* Prevents mobile scrolling while aiming */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        /* Landscape orientation recommendation notice for small portrait phones */
        #orientation-warning {
            position: fixed;
            inset: 0;
            background: rgba(11, 13, 25, 0.96);
            z-index: 300;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        #orientation-warning i {
            font-size: 3rem;
            color: var(--primary-cyan);
            margin-bottom: 1rem;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        #orientation-warning h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        #orientation-warning p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 300px;
        }

        @keyframes rotatePhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
        }

        #orientation-warning:not(.hidden) {
            display: flex;
        }

        #orientation-warning .btn {
            margin-top: 1.5rem;
        }

        /* Floating Header Overlay */
        .header-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            z-index: 100;
        }

        .header-controls {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { border-color: var(--primary-cyan); color: var(--primary-cyan); }
        .btn.active { background: rgba(0, 242, 254, 0.15); border-color: var(--primary-cyan); color: var(--primary-cyan); }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }
        .back-btn:hover { color: var(--primary-cyan); }

        /* Fullscreen Game Space */
        .table-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 1;
        }

        canvas#poolCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Floating Footer Overlay */
        .status-panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            z-index: 100;
        }

        .player-info { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
        .p1-info { color: var(--text-main); justify-content: flex-start; }
        .p2-info { color: var(--text-main); justify-content: flex-end; }
        
        .active-turn { color: var(--primary-cyan); text-shadow: 0 0 8px rgba(0, 242, 254, 0.4); }
        
        .ball-type-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
        }

        .status-msg {
            font-weight: 800;
            color: var(--primary-cyan);
            text-align: center;
            padding: 0 1rem;
        }

        /* GameOver Modal Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 13, 25, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .overlay h2 { color: #fff; font-size: 2.5rem; margin-bottom: 1.5rem; text-align: center; padding: 0 1rem; }

        @media (max-width: 600px) {
            .header-bar h2 { display: none; }
            .status-panel { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
            .status-msg { grid-column: span 2; padding: 0; order: -1; }
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <i class="fa-solid fa-mobile-screen-button orientation-icon"></i>
        <h3>Rotate Your Device</h3>
        <p>For the best gameplay experience on mobile, please turn your device sideways to landscape mode.</p>
        <button class="btn primary" id="dismiss-orientation-btn">Continue Anyway</button>
    </div>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <h2>8-Ball Pool Pro</h2>
        <div class="header-controls">
            <button id="btnPvE" class="btn active"><i class="fa-solid fa-robot"></i> vs Bot</button>
            <button id="btnPvP" class="btn"><i class="fa-solid fa-user-group"></i> PvP</button>
        </div>
    </div>

    <div class="table-wrapper" id="canvasWrapper">
        <canvas id="poolCanvas"></canvas>
    </div>

    <div class="status-panel">
        <div class="player-info p1-info" id="p1Display">
            Player 1 <span id="p1Type" class="ball-type-badge">OPEN</span> <span id="p1Count">(7)</span>
        </div>
        <div id="statusMsg" class="status-msg">Break Shot!</div>
        <div class="player-info p2-info" id="p2Display">
            <span id="p2Count">(7)</span> <span id="p2Type" class="ball-type-badge">OPEN</span> Bot
        </div>
    </div>

    <div id="gameOverOverlay" class="overlay">
        <h2 id="winnerText">Player 1 Wins!</h2>
        <button id="btnRestart" class="btn" style="font-size: 1.2rem; padding: 0.8rem 2rem;"><i class="fa-solid fa-rotate-right"></i> Play Again</button>
    </div>

    <script src="pool.js"></script>
</body>
</html>
