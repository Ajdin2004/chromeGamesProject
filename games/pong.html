<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong | Chromium Games</title>
    <link rel="icon" type="image/png" href="https://pngfre.com/wp-content/uploads/Table-Tennis-7.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(22, 27, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-cyan: #00f2fe;
            --primary-magenta: #4facfe;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 0.75rem;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--primary-cyan);
        }

        .settings-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 600px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .mode-selector {
            display: flex;
            gap: 0.35rem;
            background: var(--card-bg);
            padding: 0.35rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-magenta));
            color: #000;
            font-weight: 800;
        }

        .control-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.35rem 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .control-box select {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--card-border);
            color: var(--primary-cyan);
            font-weight: 700;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 242, 254, 0.15);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        canvas {
            display: block;
            background: #101426;
        }

        .instructions {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <h2>Neon Pong</h2>
    </div>

    <div class="settings-bar">
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="ai">1 Player vs AI</button>
            <button class="mode-btn" data-mode="pvp">2 Players</button>
        </div>

        <div class="control-box" id="ai-difficulty-box">
            <label for="ai-diff">AI Level:</label>
            <select id="ai-diff">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
                <option value="impossible">Unbeatable</option>
            </select>
        </div>

        <div class="control-box">
            <label for="score-limit">Target Score:</label>
            <select id="score-limit">
                <option value="3">3 Points</option>
                <option value="5" selected>5 Points</option>
                <option value="10">10 Points</option>
            </select>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <p class="instructions" id="control-hint">P1: <strong>W/S</strong> &nbsp;|&nbsp; AI Controlled Right Paddle</p>

    <script src="pong.js"></script>
</body>
</html>
