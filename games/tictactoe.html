<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | Chromium Games</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232b2b29'/><path d='M9 9l14 14M23 9L9 23' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/><circle cx='21.5' cy='20' r='6' fill='none' stroke='%23c9c5bb' stroke-width='3.5'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* ---- DARK THEME (default) ---- */
            --bg-color: #16171c;
            --card-bg: #232429;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-cyan: #7aa7d6;
            --accent-fg: #101218;
            --primary-magenta: #d97f78;
            --text-main: #e8e6e0;
            --text-muted: #9aa0a8;
            --soft-bg: #1d1e23;
            --btn-primary-bg: #eceeed;
            --btn-primary-fg: #1c1d21;
            --btn-primary-border: #eceeed;
            --divider: rgba(255, 255, 255, 0.06);
            --shadow-card: rgba(0, 0, 0, 0.35);
            --shadow-board: rgba(0, 0, 0, 0.42);
            --cell-bg: #2a2c33;
            --cell-border: rgba(255, 255, 255, 0.09);
            --cell-hover-bg: #33363e;
            --cell-hover-border: rgba(255, 255, 255, 0.16);
            --mark-x: #f0eeea;
            --mark-o: #9aa0a8;
        }

        :root[data-theme="light"] {
            /* ---- LIGHT THEME ---- */
            --bg-color: #f1efe8;
            --card-bg: #ffffff;
            --card-border: #e2ded4;
            --primary-cyan: #3d6ea5;
            --accent-fg: #ffffff;
            --primary-magenta: #b3423b;
            --text-main: #2b2b29;
            --text-muted: #7d7a72;
            --soft-bg: #f4f2ec;
            --btn-primary-bg: #20201f;
            --btn-primary-fg: #ffffff;
            --btn-primary-border: #20201f;
            --divider: rgba(0, 0, 0, 0.06);
            --shadow-card: rgba(52, 48, 40, 0.06);
            --shadow-board: rgba(52, 48, 40, 0.12);
            --cell-bg: #faf9f6;
            --cell-border: #e2ded4;
            --cell-hover-bg: #f4f2ec;
            --cell-hover-border: #cecabe;
            --mark-x: #2b2b29;
            --mark-o: #8a877f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
            overflow-x: hidden;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 0.75rem;
            z-index: 10;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--primary-cyan);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .theme-toggle:hover { border-color: var(--primary-cyan); color: var(--primary-cyan); }
        .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: inline; }

        /* Controls & Mode Bar */
        .controls-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 900px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: flex;
            gap: 0.4rem;
            background: var(--card-bg);
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--primary-cyan);
            color: var(--accent-fg);
            font-weight: 700;
        }

        .slider-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--card-bg);
            padding: 0.4rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .slider-box label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .slider-box label span {
            color: var(--primary-cyan);
            font-weight: 700;
        }

        .slider-box input[type="range"] {
            accent-color: var(--primary-cyan);
            cursor: pointer;
        }

        /* Main Game Layout Grid */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
            width: 100%;
            max-width: 900px;
            align-items: start;
        }

        /* Board Container */
        .game-wrapper {
            position: relative;
            box-shadow: 0 18px 44px var(--shadow-board);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 0.5rem;
            gap: 0.5rem;
        }

        .cell {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.5rem, 10vw, 5rem);
            cursor: pointer;
            position: relative;
            transition: background 0.15s ease, border-color 0.15s ease;
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            border-radius: 12px;
        }

        .cell:hover {
            background: var(--cell-hover-bg);
            border-color: var(--cell-hover-border);
        }

        .cell.filled {
            cursor: default;
        }

        .cell.filled:hover {
            background: var(--cell-bg);
            border-color: var(--cell-border);
        }

        .cell.winning {
            background: rgba(77, 122, 80, 0.12) !important;
            border-color: #4d7a50 !important;
            box-shadow: inset 0 0 0 2px rgba(77, 122, 80, 0.5);
        }

        .mark {
            display: inline-block;
            animation: markAppear 0.2s ease-out;
        }

        @keyframes markAppear {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .mark-x {
            color: var(--mark-x);
            font-weight: 700;
        }

        .mark-o {
            color: var(--mark-o);
            font-weight: 400;
        }

        /* Sidebar Info Box */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 10px 30px var(--shadow-card);
        }

        .panel h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .status-msg {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary-cyan);
        }

        /* Scoreboard */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .score-item {
            text-align: center;
            padding: 0.6rem 0.4rem;
            background: var(--soft-bg);
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .score-item .score-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-item .score-value {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 0.2rem;
        }

        .score-item.wins .score-value { color: var(--primary-cyan); }
        .score-item.losses .score-value { color: var(--primary-magenta); }
        .score-item.draws .score-value { color: var(--text-muted); }

        .move-history {
            max-height: 160px;
            overflow-y: auto;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            color: var(--text-main);
        }

        .move-entry {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0.4rem;
            border-bottom: 1px solid var(--divider);
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        .btn-action {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: var(--soft-bg);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
        }

        .btn-primary {
            background: var(--btn-primary-bg);
            border: 1px solid var(--btn-primary-border);
            color: var(--btn-primary-fg);
        }
        .btn-primary:hover { opacity: 0.9; color: var(--btn-primary-fg); border-color: var(--btn-primary-border); }

        /* Puzzle panel */
        .puzzle-card {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Desktop Layout Adaptations */
        @media (min-width: 850px) {
            .main-layout {
                grid-template-columns: 500px 1fr;
            }
            .sidebar { height: 100%; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <div class="header-right">
            <h2>Tic-Tac-Toe</h2>
            <button id="theme-toggle" class="theme-toggle" title="Toggle light / dark mode" aria-label="Toggle theme">
                <i class="fa-solid fa-sun icon-sun"></i>
                <i class="fa-solid fa-moon icon-moon"></i>
            </button>
        </div>
    </div>

    <!-- Mode & Settings Bar -->
    <div class="controls-bar">
        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-vs-ai">Vs AI</button>
            <button class="mode-btn" id="btn-2p">2 Player</button>
            <button class="mode-btn" id="btn-puzzles">Puzzles</button>
        </div>

        <div class="slider-box" id="ai-difficulty-box">
            <label for="difficulty-slider">AI Level: <span id="diff-val">3</span></label>
            <input type="range" id="difficulty-slider" min="1" max="5" value="3">
        </div>
    </div>

    <div class="main-layout">
        <!-- Board Grid -->
        <div class="game-wrapper">
            <div id="board"></div>
        </div>

        <!-- Sidebar Panel -->
        <div class="sidebar">
            <div class="panel">
                <h3>STATUS</h3>
                <div id="status" class="status-msg">Your Turn (X)</div>
            </div>

            <div class="panel">
                <h3>SCOREBOARD</h3>
                <div class="scoreboard">
                    <div class="score-item wins">
                        <div class="score-label">Wins</div>
                        <div class="score-value" id="score-wins">0</div>
                    </div>
                    <div class="score-item losses">
                        <div class="score-label">Losses</div>
                        <div class="score-value" id="score-losses">0</div>
                    </div>
                    <div class="score-item draws">
                        <div class="score-label">Draws</div>
                        <div class="score-value" id="score-draws">0</div>
                    </div>
                </div>
            </div>

            <div class="panel puzzle-card" id="puzzle-panel">
                <h3>CHALLENGES</h3>
                <button class="btn-action btn-primary" id="btn-next-puzzle">Next Puzzle</button>
                <div id="puzzle-desc" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem;">Win in 1 move - X to Move</div>
            </div>

            <div class="panel">
                <h3>MOVE LOG</h3>
                <div id="move-log" class="move-history"></div>
            </div>

            <div class="action-row">
                <button class="btn-action" id="btn-save"><i class="fa-solid fa-floppy-disk"></i> Save Game</button>
                <button class="btn-action" id="btn-load"><i class="fa-solid fa-folder-open"></i> Load Game</button>
            </div>

            <button class="btn-action btn-primary" id="btn-reset"><i class="fa-solid fa-rotate-right"></i> New Game</button>
        </div>
    </div>

    <script>
        // Theme toggle — dark is the default, persisted across all games
        (function () {
            var KEY = 'cg_theme';
            var theme = localStorage.getItem(KEY) || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (btn) btn.addEventListener('click', function () {
                theme = theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem(KEY, theme);
                document.documentElement.setAttribute('data-theme', theme);
            });
        })();
    </script>

    <script src="tictactoe.js"></script>
</body>
</html>
