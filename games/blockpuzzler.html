<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Puzzler | Chromium Games</title>
    <link rel="icon" type="image/png" href="https://toppng.com/uploads/preview/tetris-blocks-115507227556qa8dp7yek.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(22, 27, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-cyan: #00f2fe;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            touch-action: none; /* Prevents unwanted scrolling during swipes */
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            overflow: hidden;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            flex-shrink: 0;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--primary-cyan);
        }

        .main-layout {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            flex: 1;
            min-height: 0; /* Critical for dynamic flexbox scaling */
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 242, 254, 0.15);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101426;
        }

        canvas#gameCanvas {
            display: block;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100px;
            height: 100%;
            justify-content: space-around;
            flex-shrink: 0;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.4rem;
            text-align: center;
        }

        .panel h3 {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .panel-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-cyan);
        }

        canvas#nextCanvas {
            display: block;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .instructions {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
            flex-shrink: 0;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <h2>Block Puzzler</h2>
    </div>

    <div class="main-layout">
        <div class="game-wrapper" id="wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>NEXT</h3>
                <canvas id="nextCanvas"></canvas>
            </div>
            <div class="panel">
                <h3>SCORE</h3>
                <div id="score" class="panel-val">0</div>
            </div>
            <div class="panel">
                <h3>LEVEL</h3>
                <div id="level" class="panel-val">1</div>
            </div>
            <div class="panel">
                <h3>LINES</h3>
                <div id="lines" class="panel-val">0</div>
            </div>
        </div>
    </div>

    <p class="instructions">
        <strong>Double-Tap:</strong> Rotate &nbsp;|&nbsp; <strong>Swipe Left/Right:</strong> Move &nbsp;|&nbsp; <strong>Swipe Down:</strong> Soft Drop &nbsp;|&nbsp; <strong>Fast Swipe Down:</strong> Hard Drop
    </p>

    <script src="blockpuzzler.js"></script>
</body>
</html>
