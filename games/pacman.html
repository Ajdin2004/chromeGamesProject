<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pac-Man · Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: #0b0d19;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #f0f4f8;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 560px;
            margin-bottom: 0.8rem;
        }
        .back {
            color: #f0f4f8;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.2s;
        }
        .back:hover { color: #facc15; }
        .header-title {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }
        .header-title i { color: #facc15; margin-right: 0.3rem; }
        .score-pill {
            background: rgba(255,255,255,0.04);
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            font-weight: 700;
            font-size: 0.85rem;
            color: #facc15;
        }
        .game-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(250, 204, 21, 0.12);
            border: 1px solid rgba(255,255,255,0.06);
            max-width: 560px;
            width: 100%;
            aspect-ratio: 21/24;
            background: #030406;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            background: transparent;
        }
        .info {
            margin-top: 0.8rem;
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            font-weight: 400;
            color: #94a3b8;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }
        .info i { margin-right: 0.25rem; color: #facc15; }
        .info .lives-ico { color: #ef4444; }
        @media (max-width: 480px) {
            .header { flex-wrap: wrap; gap: 0.4rem; }
            .score-pill { margin-left: auto; }
        }
    </style>
</head>
<body>
<div class="header">
    <a href="../index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    <h2 class="header-title"><i class="fa-solid fa-ghost"></i>Pac-Man</h2>
    <div class="score-pill"><i class="fa-solid fa-trophy"></i> <span id="highDisplay">0</span></div>
</div>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="672" height="768"></canvas>
</div>
<div class="info">
    <span><i class="fa-regular fa-keyboard"></i> Arrow / WASD</span>
    <span><i class="fa-solid fa-trophy"></i> High: <span id="highDisplay2">0</span></span>
    <span><i class="fa-solid fa-heart lives-ico"></i> Lives: <span id="livesDisplay">3</span></span>
</div>
    <script src="pacman.js"></script>
</body>
</html>
