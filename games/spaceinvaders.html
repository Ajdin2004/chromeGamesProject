<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Invaders | Chromium Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(22, 27, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-cyan: #00f2fe;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 0.75rem;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--primary-cyan);
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 242, 254, 0.15);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        canvas {
            display: block;
            background: #0d0614;
            touch-action: none;
        }

        .instructions {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <h2>Space Invaders</h2>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="500" height="600"></canvas>
    </div>

    <p class="instructions">
        <strong>← / →</strong> or <strong>A / D</strong> Move &nbsp;|&nbsp; <strong>Space</strong> Shoot
        <br><strong>Touch:</strong> Tap left/right to move, tap to shoot.
    </p>

    <script src="spaceinvaders.js"></script>
</body>
</html>
