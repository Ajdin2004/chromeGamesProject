<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Loldle | Chromium Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(22, 27, 46, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary-cyan: #00f2fe;
            --correct-green: #22c55e;
            --partial-yellow: #eab308;
            --wrong-red: #ef4444;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
            overflow-x: hidden;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 920px;
            margin-bottom: 1rem;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }
        .back-btn:hover { color: var(--primary-cyan); }

        .game-panel {
            width: 100%;
            max-width: 920px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Search Input */
        .search-container { position: relative; }

        .input-box { display: flex; gap: 0.5rem; }

        .input-box input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .input-box input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-cyan), #4facfe);
            border: none;
            color: #000;
            font-weight: 800;
            padding: 0 1.5rem;
            border-radius: 12px;
            cursor: pointer;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0; right: 0;
            background: rgba(15, 18, 35, 0.95);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 50;
            margin-top: 4px;
            display: none;
        }

        .suggestion-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .suggestion-item img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--primary-cyan);
        }

        .suggestion-item:hover {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary-cyan);
        }

        /* Feature Header Labels */
        .grid-header {
            display: grid;
            grid-template-columns: 1.8fr repeat(6, 1fr);
            gap: 6px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 0.2rem;
        }

        /* Guess Log Grid */
        .guesses-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .guess-row {
            display: grid;
            grid-template-columns: 1.8fr repeat(6, 1fr);
            gap: 6px;
            align-items: center;
        }

        .attribute-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 0.6rem 0.3rem;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            text-transform: capitalize;
            line-height: 1.2;
        }

        .attribute-box.correct {
            background: rgba(34, 197, 94, 0.35);
            border-color: var(--correct-green);
            color: #fff;
        }

        .attribute-box.partial {
            background: rgba(234, 179, 8, 0.35);
            border-color: var(--partial-yellow);
            color: #fff;
        }

        .attribute-box.wrong {
            background: rgba(239, 68, 68, 0.35);
            border-color: var(--wrong-red);
            color: #fff;
        }

        .champ-card {
            background: rgba(0, 242, 254, 0.1);
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0.4rem 0.6rem;
            gap: 0.6rem;
            text-align: left;
        }

        .champ-avatar {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--primary-cyan);
            flex-shrink: 0;
        }

        .toast {
            text-align: center;
            font-weight: 700;
            color: var(--primary-cyan);
            min-height: 20px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <h2>Daily Loldle</h2>
    </div>

    <div class="game-panel">
        <div class="search-container">
            <div class="input-box">
                <input type="text" id="champ-input" placeholder="Loading champions dataset..." autocomplete="off">
                <button id="btn-guess" class="btn-submit">GUESS</button>
            </div>
            <div id="suggestions" class="suggestions"></div>
        </div>

        <div class="grid-header">
            <span>Champion</span>
            <span>Gender</span>
            <span>Position</span>
            <span>Species</span>
            <span>Resource</span>
            <span>Range</span>
            <span>Region</span>
        </div>

        <div id="guesses-container" class="guesses-list"></div>

        <div id="toast" class="toast">Fetching official DataDragon dataset...</div>
    </div>

    <script src="loldle.js"></script>
</body>
</html>
