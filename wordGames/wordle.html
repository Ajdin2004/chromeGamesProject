<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Wordle | Chromium Games</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5228/5228257.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="atelier-shared.css">
    <style>
        /* Daily Wordle — page identity + board/keyboard layout. The shared
           Atelier shell (header, panel, modals, responsive) lives in
           atelier-shared.css. Identity: grass-green accent. */
        :root {
            --accent: #2e9e4f;
            --accent-fg: #0f0f11;
            --accent-soft: rgba(46, 158, 79, 0.15);
            --wallpaper: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240"><rect width="100%" height="100%" fill="%230d0d10"/><rect x="60" y="44" width="34" height="34" rx="6" fill="%232e9e4f" opacity="0.85"/><rect x="104" y="44" width="34" height="34" rx="6" fill="%2334343a"/><rect x="148" y="44" width="34" height="34" rx="6" fill="%23eab308" opacity="0.7"/><rect x="192" y="44" width="34" height="34" rx="6" fill="%232e9e4f" opacity="0.85"/><rect x="104" y="88" width="34" height="34" rx="6" fill="%23eab308" opacity="0.6"/><rect x="148" y="88" width="34" height="34" rx="6" fill="%232e9e4f" opacity="0.85"/><rect x="192" y="88" width="34" height="34" rx="6" fill="%23eab308" opacity="0.6"/></svg>');

            /* Legacy tokens → Atelier so the game JS/DOM still resolves */
            --primary-cyan: var(--accent);
            --bg-color: var(--bg-0);
            --card-bg: var(--bg-1);
            --card-border: var(--line);
            --text-main: var(--ink);
            --text-muted: var(--ink-muted);
            --correct-green: #2e9e4f;
            --present-yellow: #eab308;
            --absent-gray: #34343a;
        }

        /* Wordle Grid */
        .board-container {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .tile {
            width: 54px;
            height: 54px;
            border: 2px solid var(--line-soft);
            border-radius: var(--r-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            font-family: var(--font-display);
            background: var(--bg-2);
            color: var(--ink);
            transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .tile[data-state="active"] { border-color: var(--accent); transform: scale(1.05); }
        .tile[data-state="correct"] { background: var(--correct-green); border-color: var(--correct-green); color: var(--correct-ink); }
        .tile[data-state="present"] { background: var(--present-yellow); border-color: var(--present-yellow); color: var(--partial-ink); }
        .tile[data-state="absent"] { background: var(--absent-gray); border-color: var(--absent-gray); color: var(--ink-muted); }

        /* Virtual Keyboard */
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 480px;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .key {
            background: var(--bg-2);
            border: 1px solid var(--line-soft);
            color: var(--ink);
            border-radius: var(--r-sm);
            padding: 0.8rem 0.6rem;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            flex: 1;
            text-align: center;
            font-family: var(--font-body);
            transition: all 0.15s ease;
        }

        .key:hover { border-color: var(--accent); color: var(--accent); }
        .key.wide { flex: 1.5; font-size: 0.75rem; }
        .key[data-state="correct"] { background: var(--correct-dim); border-color: transparent; color: var(--correct-ink); }
        .key[data-state="present"] { background: var(--partial-dim); border-color: transparent; color: var(--partial-ink); }
        .key[data-state="absent"] { opacity: 0.35; }

        /* Floating toast (game UI; overrides the shell's inline .toast) */
        .toast {
            position: fixed;
            top: 16%;
            background: var(--accent);
            color: var(--accent-fg);
            padding: 0.75rem 1.5rem;
            border-radius: var(--r-lg);
            font-weight: 800;
            border: var(--b-w) solid var(--accent);
            box-shadow: 4px 4px 0 var(--accent-contrast);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 150;
        }
        .toast.show { opacity: 1; }

        /* Modal close (x) button — shell .modal-card is position:relative */
        .modal-close {
            position: absolute;
            top: 0.6rem;
            right: 0.7rem;
            background: none;
            border: none;
            color: var(--ink-muted);
            font-size: 1.05rem;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--accent); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            width: 100%;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 0.4rem;
            background: var(--bg-2);
            border: 1px solid var(--line-soft);
            border-radius: var(--r-sm);
        }

        .stat-num {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 0.68rem;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="header-left">
            <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
            <h1 class="header-title"><i class="fa-solid fa-keyboard"></i> Daily Wordle</h1>
        </div>
        <div class="header-controls">
            <button id="btn-wallpaper" class="icon-btn" title="Show wallpaper"><i class="fa-regular fa-image"></i></button>
            <button id="share-btn" class="icon-btn" title="Share result"><i class="fa-solid fa-share-nodes"></i></button>
            <button id="stats-btn" class="icon-btn" title="Stats"><i class="fa-solid fa-chart-simple"></i></button>
            <button id="help-btn" class="icon-btn" title="How to play"><i class="fa-solid fa-circle-question"></i></button>
        </div>
    </header>

    <div id="stats-modal" class="modal-overlay">
        <div class="modal-card">
            <button id="stats-close" class="modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-title">Statistics</div>
            <div class="stats-grid">
                <div class="stat"><span class="stat-num" id="stat-played">0</span><span class="stat-label">Played</span></div>
                <div class="stat"><span class="stat-num" id="stat-win-pct">0</span><span class="stat-label">Win %</span></div>
                <div class="stat"><span class="stat-num" id="stat-streak">0</span><span class="stat-label">Streak</span></div>
                <div class="stat"><span class="stat-num" id="stat-max-streak">0</span><span class="stat-label">Max</span></div>
            </div>
        </div>
    </div>

    <!-- Help modal -->
    <div id="help-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">How to Play</div>
            <div class="help-content">
                <h3>Objective</h3>
                <p>Guess today's <strong>5-letter word</strong> in <strong>6 attempts</strong> or less.</p>
                <h3>Colours</h3>
                <div class="color-demo">
                    <span class="demo-correct">Correct letter + spot</span>
                    <span class="demo-partial">Right letter, wrong spot</span>
                    <span class="demo-wrong">Not in word</span>
                </div>
                <h3>⌨️ Shortcuts</h3>
                <div class="help-shortcuts">
                    <p><kbd>Enter</kbd> Submit &nbsp; <kbd>Backspace</kbd> Undo &nbsp; Type or tap keys to guess</p>
                </div>
            </div>
            <button id="help-close" class="btn-close-win">GOT IT</button>
        </div>
    </div>

    <div id="toast" class="toast">Not in word list</div>

    <div class="game-panel">
    <div id="board" class="board-container"></div>

    <div id="keyboard" class="keyboard">
        <div class="key-row">
            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>
        </div>
        <div class="key-row">
            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>
        </div>
        <div class="key-row">
            <button class="key wide" data-key="ENTER">ENTER</button>
            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>
            <button class="key wide" data-key="BACKSPACE">BACK</button>
        </div>
    </div>
    </div>

    <script src="atelier-shell.js"></script>
    <script src="wordle.js"></script>
</body>
</html>
