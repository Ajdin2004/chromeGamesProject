<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Boggle | Chromium Games</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0d19'/><rect x='15' y='15' width='70' height='70' rx='12' fill='%23161b2e' stroke='%2300f2fe' stroke-width='4'/><text x='50' y='68' font-family='sans-serif' font-weight='800' font-size='50' fill='%2300f2fe' text-anchor='middle'>B</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(22, 27, 46, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary-cyan: #00f2fe;
            --correct-green: #22c55e;
            --wrong-red: #ef4444;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
            overflow-x: hidden;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 0.5rem;
            z-index: 10;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }
        .back-btn:hover { color: var(--primary-cyan); }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
            align-items: start;
            transition: all 0.3s ease;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.25rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .cell.active {
            background: linear-gradient(135deg, var(--primary-cyan), #4facfe);
            color: #000;
            box-shadow: 0 0 16px rgba(0, 242, 254, 0.4);
            transform: scale(0.96);
        }

        .cell.invalid {
            background: rgba(239, 68, 68, 0.4);
            border-color: var(--wrong-red);
            color: #fff;
        }

        .current-word-bar {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .current-word-bar span {
            color: var(--primary-cyan);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .game-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.25rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
        }

        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--primary-cyan); }

        .difficulty-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.25rem;
            gap: 0.25rem;
        }

        .diff-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            padding: 0.4rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .diff-btn.active {
            background: var(--card-border);
            color: var(--primary-cyan);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        .btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-weight: 700;
            padding: 0.65rem;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-cyan), #4facfe);
            border: none;
            color: #000;
        }
        .btn-primary:hover { opacity: 0.9; color: #000; }

        .found-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .found-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .found-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            max-height: 140px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.65rem;
        }

        .found-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.25rem 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .found-tag span {
            color: var(--primary-cyan);
            font-size: 0.75rem;
        }

        .toast {
            text-align: center;
            font-weight: 700;
            color: var(--primary-cyan);
            min-height: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .layout-grid { grid-template-columns: 1fr; }
        }

        @media (min-width: 1024px) {
            body { padding: 2rem 0; }
            .layout-grid {
                max-width: 1000px;
                grid-template-columns: 1.2fr 0.8fr;
            }
            .board-wrapper { height: 100%; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        <h2>Daily Boggle</h2>
    </div>

    <div class="layout-grid">
        <div class="board-wrapper">
            <div id="board" class="board" aria-label="Boggle board"></div>
            <div class="current-word-bar">
                Word: <span id="current-word">---</span>
            </div>
        </div>

        <div class="game-panel">
            <div class="panel-header">
                <div class="stat-box">
                    <span class="stat-label">Time Left</span>
                    <span id="timer" class="stat-value">03:00</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Score</span>
                    <span id="score" class="stat-value">0</span>
                </div>
            </div>

            <div class="difficulty-selector">
                <button class="diff-btn" data-diff="easy">Easy (4m)</button>
                <button class="diff-btn active" data-diff="medium">Medium (3m)</button>
                <button class="diff-btn" data-diff="hard">Hard (2m)</button>
            </div>

            <div class="controls-grid">
                <button id="submit-btn" class="btn btn-primary"><i class="fa-solid fa-check"></i> Submit</button>
                <button id="clear-btn" class="btn"><i class="fa-solid fa-xmark"></i> Clear</button>
                <button id="hint-btn" class="btn"><i class="fa-solid fa-lightbulb"></i> Hint</button>
                <button id="shuffle-btn" class="btn"><i class="fa-solid fa-shuffle"></i> Shuffle</button>
            </div>

            <button id="new-btn" class="btn" style="width: 100%;"><i class="fa-solid fa-rotate-right"></i> New Game</button>

            <div class="found-section">
                <div class="found-title">
                    <span>Found Words</span>
                    <span id="found-count">0</span>
                </div>
                <div id="found" class="found-list"></div>
            </div>

            <div id="toast" class="toast">Drag or click letters to form words!</div>
        </div>
    </div>

    <script src="boggle.js"></script>
</body>
</html>
